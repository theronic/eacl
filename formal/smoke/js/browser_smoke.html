<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EACL generated-kernel browser smoke</title>
  </head>
  <body data-status="running">
    <main>
      <h1>EACL generated-kernel browser smoke</h1>
      <pre id="result">Running…</pre>
    </main>
    <script src="./EaclKernel.browser.js"></script>
    <script>
      (() => {
        const { EaclKernel, _dafny, BigNumber } = globalThis.EaclFormal;
        const invoke = (tag, values, limit) =>
          EaclKernel.__default.RoundTrip(
            _dafny.Seq.UnicodeFromString(tag),
            new _dafny.Seq(...values.map((n) => new BigNumber(n))),
            new BigNumber(limit),
          );
        const accepted = invoke("eacl.round-trip/v1", [0, 7, 42], 3);
        const rejected = invoke("eacl.round-trip/v1", [1, -1], 2);
        const values = Array.from(
          accepted.dtor_items,
          (n) => n.toNumber(),
        );
        const passed =
          accepted.is_Accepted &&
          rejected.is_Rejected &&
          JSON.stringify(values) === JSON.stringify([0, 7, 42]);

        document.body.dataset.status = passed ? "passed" : "failed";
        document.querySelector("#result").textContent = JSON.stringify(
          {
            passed,
            accepted: accepted.toString(),
            rejected: rejected.toString(),
            values,
          },
          null,
          2,
        );
        if (!passed) {
          throw new Error("generated-kernel browser smoke failed");
        }
      })();
    </script>
  </body>
</html>
