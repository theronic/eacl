name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Same-repo branches already build via the push event; run the
    # pull_request event only for PRs from forks to avoid double runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ runner.os }}-${{ hashFiles('deps.edn', 'modules/*/deps.edn') }}
          restore-keys: cljdeps-${{ runner.os }}-

      - name: Run tests
        # ^:benchmark load tests (modules/eacl-datomic/test/eacl/bench/) are
        # excluded per AGENTS.md; run them explicitly through nREPL when
        # validating performance changes.
        run: clojure -X:test :excludes '[:benchmark]'

      - name: Run DataScript ClojureScript tests
        run: |
          mkdir -p target
          clojure -M:datascript-cljs-test
          node target/datascript-cljs-test.js

  isolated-modules:
    strategy:
      fail-fast: false
      matrix:
        module: [eacl, eacl-datomic, eacl-datascript, eacl-datahike]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ runner.os }}-${{ matrix.module }}-${{ hashFiles('modules/*/deps.edn') }}
          restore-keys: cljdeps-${{ runner.os }}-${{ matrix.module }}-

      - name: Run isolated module tests
        working-directory: modules/${{ matrix.module }}
        run: clojure -X:test :excludes '[:benchmark]'

      - name: Build isolated module artifact
        working-directory: modules/${{ matrix.module }}
        run: clojure -T:build jar
